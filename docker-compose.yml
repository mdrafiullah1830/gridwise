version: "3.9"

services:
  gridwise:
    build: .
    container_name: gridwise
    ports:
      - "${GRIDWISE_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - GRIDWISE_HOST=0.0.0.0
      - GRIDWISE_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
